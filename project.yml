name: WorldClock
options:
  bundleIdPrefix: com.ac1982
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: 228T79JAL2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  WorldClock:
    type: application
    platform: macOS
    sources: [App, Shared]
    entitlements:
      path: App/WorldClock.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ac1982.worldclock
        PRODUCT_NAME: WorldClock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: World Clock
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WorldClockWidget
  WorldClockWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: World Clock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/WorldClockWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ac1982.worldclock.widget
        PRODUCT_NAME: WorldClockWidget
        ENABLE_HARDENED_RUNTIME: YES
  WorldClockTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ac1982.worldclock.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
  ClockSnapshots:
    type: tool
    platform: macOS
    sources: [Snapshots, Shared]
    settings:
      base:
        PRODUCT_NAME: clock-snapshots
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
schemes:
  WorldClock:
    build:
      targets:
        WorldClock: all
    test:
      targets: [WorldClockTests]
    run:
      config: Debug
  ClockSnapshots:
    build:
      targets:
        ClockSnapshots: all

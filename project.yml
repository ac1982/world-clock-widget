name: WorldClock
options:
  bundleIdPrefix: com.ac1982
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Local builds are sandboxed and ad-hoc signed; no developer account required.
    # To use a team instead: DEVELOPMENT_TEAM=<id> CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development".
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  WorldClock:
    type: application
    platform: macOS
    sources: [Sources/App, Sources/Core, Sources/Storage, Sources/Presentation]
    info:
      path: Sources/App/Info.plist
      properties:
        # LaunchServices must suppress the Dock tile before widget URLs reach the delegate.
        # Explicit editor launches promote the app to .regular in showEditor().
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ac1982.worldclock.cities
            CFBundleURLSchemes: [worldclock]
    entitlements:
      path: Sources/App/WorldClock.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write: ["/Library/Application Support/WorldClockShared/"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ac1982.worldclock
        PRODUCT_NAME: WorldClock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: World Clock
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconV2
    dependencies:
      - target: WorldClockWidget
  WorldClockWidget:
    type: app-extension
    platform: macOS
    sources: [Sources/Widget, Sources/Core, Sources/Storage, Sources/Presentation]
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: World Clock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widget/WorldClockWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only: ["/Library/Application Support/WorldClockShared/"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ac1982.worldclock.widget
        PRODUCT_NAME: WorldClockWidget
        ENABLE_HARDENED_RUNTIME: YES
  WorldClockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Core
      - Sources/Storage
      - Sources/App/Editor/CityEditorModel.swift
      - Sources/Widget/CityOptionsProvider.swift
      - Sources/Widget/SelectCitiesIntent.swift
      - Sources/Widget/WidgetSize+WidgetKit.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ac1982.worldclock.tests
        GENERATE_INFOPLIST_FILE: YES
  ClockSnapshots:
    type: tool
    platform: macOS
    sources: [Snapshots, Sources/Core, Sources/Presentation, Sources/App/ContentView.swift, Sources/App/Editor]
    settings:
      base:
        PRODUCT_NAME: clock-snapshots
schemes:
  WorldClock:
    build:
      targets:
        WorldClock: all
    test:
      targets: [WorldClockTests]
    run:
      config: Debug
  ClockSnapshots:
    build:
      targets:
        ClockSnapshots: all

name: Signed Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check notarization credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_API_KEY_P8" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER_ID" || {
            echo 'Configure APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID repository secrets before publishing.'
            exit 1
          }
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Test
        run: |
          xcodegen generate -q
          xcrun swiftc -swift-version 6 -typecheck Sources/Core/*.swift
          xcodebuild -project WorldClock.xcodeproj -scheme WorldClock -derivedDataPath build/DerivedData.noindex -destination 'platform=macOS,arch=arm64' test -quiet
      - name: Import Pulse signing identity
        env:
          CERTIFICATE: ${{ secrets.PULSE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.PULSE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          security list-keychains -d user > "$RUNNER_TEMP/pulse-search-list.txt"
          KEYCHAIN="$RUNNER_TEMP/pulse.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/pulse.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/pulse.p12" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          python3 - "$RUNNER_TEMP/pulse-search-list.txt" "$KEYCHAIN" <<'PYTHON'
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', sys.argv[2], *original], check=True)
          PYTHON
          rm "$RUNNER_TEMP/pulse.p12"
      - name: Build and sign
        run: ./scripts/sign-pulse.sh
      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          export APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/pulse-notary.p8"
          export APP_STORE_CONNECT_KEY_ID="$APPLE_API_KEY_ID"
          export APP_STORE_CONNECT_ISSUER_ID="$APPLE_API_ISSUER_ID"
          trap 'rm -f "$APP_STORE_CONNECT_KEY_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$APP_STORE_CONNECT_KEY_PATH"
          unset APPLE_API_KEY_P8
          ./scripts/notarize-pulse.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd build/distribution
          shasum -a 256 WorldClock-Pulse.zip > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Native World Clock Widget for Apple Silicon Macs running macOS 27 or later.

          Built and tested by GitHub Actions using Xcode 27.1. The app and widget are signed with Pulse's Developer ID Application certificate (team 89G3DBC6CS), with hardened runtime and secure timestamps.

          Apple notarization has passed. The app includes a stapled notarization ticket and has passed Gatekeeper assessment.

          Download WorldClock-Pulse.zip, extract it, and place World Clock Widget.app in ~/Applications. Then open it once to register the widget.
          NOTES
          gh release create "$RELEASE_TAG" WorldClock-Pulse.zip SHA256SUMS.txt --verify-tag --title "World Clock Widget $RELEASE_TAG" --notes-file release-notes.md
      - name: Remove signing material
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/pulse-search-list.txt" <<'PYTHON'
          import pathlib, shlex, subprocess, sys
          saved = pathlib.Path(sys.argv[1])
          if saved.exists():
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *shlex.split(saved.read_text())], check=True)
          PYTHON
          security delete-keychain "$RUNNER_TEMP/pulse.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/pulse.p12" "$RUNNER_TEMP/pulse-notary.p8" "$RUNNER_TEMP/pulse-search-list.txt"
